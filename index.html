<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lmr</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href=".css">
</head>
<body class="no-select">

    <!-- RT Controls -->
    <div class="volume-control-panel">
        <div class="volume-control bgm-control">
            <span class="vol-label">BGM</span>
            <input type="range" id="bgm-volume" min="0" max="100" step="5" value="60" oninput="updateBgmVolume(this.value)">
            <span id="bgm-volume-text" class="volume-text font-digital">60%</span>
        </div>
        <div class="volume-control se-control">
            <span class="vol-label">SE</span>
            <input type="range" id="se-volume" min="0" max="100" step="5" value="60" oninput="updateVolume(this.value)">
            <span id="volume-text" class="volume-text font-digital">60%</span>
        </div>
    </div>
    <button onclick="toggleLang()" class="lang-btn"> <span id="lang-btn">En</span></button>
    <button onclick="resetGame()" class="restart-btn"><i class="fa-solid fa-rotate-right"></i> <span id="restart-btn">Restart</span></button>
    <!-- RB -->
    <button id="mobile-flag-btn" onclick="toggleFlagMode()" class="mobile-flag-btn">
        <i class="fa-solid fa-flag text-red-500"></i><span id="flag-mode-text">Mode: Dig</span>
    </button>
        <!-- Dashboard Stats Bar -->
        <div class="stats-bar">
            <div class="stat"><span id="distance-count" class="stat-value dist-value"><i class="stat-icon fa-solid fa-person-walking text-emerald-400"></i>0m</span></div>
            <div class="stat"><span id="timer" class="stat-value time-value"><i class="stat-icon fa-regular fa-clock text-cyan-400"></i>0ms</span></div>
            <div class="stat"><span id="clicks-count" class="stat-value clicks-value"><i class="stat-icon fa-solid fa-arrow-pointer text-amber-400"></i>000</span></div>
            <div class="stat"><span id="move-speed" class="stat-value speed-value"><i class="stat-icon fa-solid fa-gauge-high text-rose-400"></i>0.0 km/h</span></div>
        </div>

    <!-- Game -->
    <main class="main-content"><div class="board-container"><div id="board" class="grid gap-1"></div></div></main>

    <!-- Footer Info -->
    <footer class="footer-info" id="footer-text">
        Left-click / Tap to dig &bull; Right-click / Toggle mode to flag &bull; Click opened numbers to Chord &bull; Clear 45/65 cells in front 5m to advance!<br>
        Credits: Sound effects by 効果音ラボ (<a href="https://soundeffect-lab.info">https://soundeffect-lab.info</a>)
    </footer>

    <div id="modal" class="modal">
        <div class="modal-card" id="modal-card">
            <h2 id="modal-title" class="modal-title lose">You died!</h2>
            <p id="modal-desc" class="modal-desc">Oof</p>

            <!-- Final Stats Summary -->
            <div class="final-score-bg font-digital">
                <span class="final-label font-sans">SCORE</span>
                <span id="final-score" class="final-score">0</span>
            </div>
            <div class="final-stats font-digital">
                <div class="final-stat">
                    <span class="final-label font-sans">DISTANCE</span>
                    <span id="final-distance" class="final-time">0m</span>
                </div>
                <div class="final-stat">
                    <span id="final-speed-label" class="final-label font-sans">SPEED</span>
                    <span id="final-speed" class="final-speed">0.0 km/h</span>
                </div>
            </div>

            <button onclick="closeModalAndReset()" class="play-again-btn" id="retry-btn">
                Try Again
            </button>
        </div>
    </div>


    <script src="bgmInfo.js"></script>
    <script src=".js"></script>
</body>
</html>
